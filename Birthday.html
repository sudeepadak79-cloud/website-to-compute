<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Maheshwar!</title>
  <style>
    body {
      text-align: center;
      background: #fef3e2;
      font-family: Arial, sans-serif;
    }
    #nextBtn, #cutCakeBtn {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
    }
    #cakeSection, #balloons {
      display: none;
    }
    #cake {
      width: 200px;
      margin-top: 20px;
    }
    .balloon {
      position: absolute;
      width: 50px;
      animation: floatUp 4s ease-in forwards;
    }
    @keyframes floatUp {
      0% { bottom: 0; opacity: 1; }
      100% { bottom: 100%; opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>🎉 Happy Birthday My Brother Maheshwar! 🎉</h1>
  <button id="nextBtn">Next</button>

  <div id="cakeSection">
    <img id="cake" src="https://cdn.pixabay.com/photo/2016/04/01/09/51/birthday-1306382_1280.png" alt="Birthday Cake">
    <br>
    <button id="cutCakeBtn">Cut the Cake 🎂</button>
  </div>

  <div id="balloons"></div>

  <script>
    const nextBtn = document.getElementById("nextBtn");
    const cakeSection = document.getElementById("cakeSection");
    const cutCakeBtn = document.getElementById("cutCakeBtn");
    const balloonsDiv = document.getElementById("balloons");

    nextBtn.onclick = () => {
      cakeSection.style.display = "block";
      nextBtn.style.display = "none";
    };

    cutCakeBtn.onclick = () => {
      createBalloons(20);
    };

    function createBalloons(count) {
      for (let i = 0; i < count; i++) {
        let balloon = document.createElement("img");
        balloon.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Balloons.svg/1024px-Balloons.svg.png";
        balloon.className = "balloon";
        balloon.style.left = Math.random() * 90 + "%";
        balloon.style.bottom = "0";
        balloon.style.height = "60px";
        balloon.style.zIndex = "1000";
        balloonsDiv.appendChild(balloon);
        setTimeout(() => {
          balloon.remove();
        }, 4000);
      }
    }
  </script>
</body>
</html>
